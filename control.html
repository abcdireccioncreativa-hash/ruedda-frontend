   Proyecto aparte (ruedda-chrono.vercel.app/chrono → ruedda.app/chrono). Tablas chrono_posts,
   chrono_rules, chrono_events, chrono_offdays, chrono_editors (SQL: chrono_migration.sql).
   Aquí: métricas del mes (mismo cálculo que el planner), pendientes, próximos 7 días, reglas,
   editores y el planner completo embebido (editable; el token va por postMessage). */
const CHRONO_URL='https://ruedda-chrono.vercel.app/chrono';
const CHR_T={historia:'Historia',reel:'Reel',post:'Post',carrusel:'Carrusel',live:'En vivo'};
const CHR_M=['reach','likes','comments','shares','saves','actions','followers'];
const chrHasM=p=>p.reach!=null&&+p.reach>0;
const chrDay=d=>new Date(d+'T12:00:00').toLocaleDateString('es-VE',{weekday:'short',day:'numeric',month:'short'});
const chrK=(ps)=>{ const w=ps.filter(chrHasM), t={posts:ps.length,withM:w.length,reach:0,inter:0,actions:0,followers:0};
  w.forEach(p=>{t.reach+=+p.reach||0;t.inter+=(+p.likes||0)+(+p.comments||0)+(+p.shares||0)+(+p.saves||0);t.actions+=+p.actions||0;t.followers+=+p.followers||0;});
  t.er=t.reach?t.inter/t.reach:0; return t; };
const chrDelta=(c,p)=>p>0?`<span class="${c>=p?'up':'dn'}" style="font-weight:700;color:${c>=p?'#1FB574':'#E5392D'}">${c>=p?'▲':'▼'} ${Math.round(Math.abs(c-p)/p*100)}%</span> vs mes anterior`:'sin mes anterior';
const chrBlk=r=>!r.from_time&&!r.to_time?'todo el día':r.from_time&&!r.to_time?'después de las '+r.from_time:!r.from_time?'antes de las '+r.to_time:'de '+r.from_time+' a '+r.to_time;
const CHR_DOW=['dom','lun','mar','mié','jue','vie','sáb'];
RENDER.chrono=async(tok,_,soft)=>{
  const V=$('#view'); if(!soft) V.innerHTML='<div class="card"><div style="padding:18px"><div class="skel" style="height:40px"></div></div></div>';
  const now=new Date(), y=now.getFullYear(), m=now.getMonth(), iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  const from=iso(new Date(y,m-1,1)), today=iso(now), in7=iso(new Date(+now+7*DAY));
  const [ps,rs,ed]=await Promise.all([
    sb.from('chrono_posts').select('id,date,time,type,platform,title,learned,example,'+CHR_M.join(',')).gte('date',from).order('date').order('time').limit(3000),
    sb.from('chrono_rules').select('*').order('created_at'),
    sb.rpc('chrono_editors_list')
  ]);
  if(stale(tok)) return;
  if(ps.error){ V.innerHTML=`<div class="notice">Ruedda Chrono todavía no está instalado: corre en Supabase el SQL <code>chrono_migration.sql</code> (se puede repetir sin problema).<br><span class="muted">${esc(ps.error.message)}</span></div>`; return; }
  const P=ps.data||[], R=rs.data||[], E=ed.data||[];
  const mPre=iso(new Date(y,m,1)).slice(0,7), pPre=from.slice(0,7);
  const cur=chrK(P.filter(p=>p.date.startsWith(mPre))), prev=chrK(P.filter(p=>p.date.startsWith(pPre)));
  const pend=P.filter(p=>p.date<today&&!chrHasM(p)).reverse();
  const next=P.filter(p=>p.date>=today&&p.date<=in7);
  // qué tipo rinde mejor este mes (interacción / alcance)
  const byT={}; P.filter(p=>p.date.startsWith(mPre)&&chrHasM(p)).forEach(p=>{const k=p.type,g=byT[k]||(byT[k]={r:0,i:0,n:0}); g.r+=+p.reach; g.i+=(+p.likes||0)+(+p.comments||0)+(+p.shares||0)+(+p.saves||0); g.n++;});
  const best=Object.entries(byT).map(([k,g])=>({k,er:g.r?g.i/g.r:0,n:g.n})).sort((a,b)=>b.er-a.er)[0];
  const K=(l,v,d)=>`<div class="card kpi"><div class="l">${l}</div><div class="v num">${v}</div><div class="d">${d}</div></div>`;
  const ex=P.some(p=>p.example);
  const row=p=>`<tr><td class="muted" style="white-space:nowrap">${esc(chrDay(p.date))} · ${esc(p.time)}</td><td><span class="pill">${esc(CHR_T[p.type]||p.type)}</span></td><td><b>${esc(p.title)}</b></td></tr>`;
  V.innerHTML=`<div style="display:flex;justify-content:flex-end;gap:8px;margin-bottom:12px"><button class="btn btn-soft" onclick="chrToggleFrame()">Ver el planner aquí</button><a class="btn btn-primary" href="/chrono" target="_blank" rel="noopener">Abrir Ruedda Chrono</a></div>
    ${ex?'<div class="notice" style="margin-bottom:12px">Hay datos de ejemplo cargados. Se borran desde el planner con “Borrar ejemplos”.</div>':''}
    <div class="grid g4">${K('Publicaciones del mes',n(cur.posts),`${n(cur.withM)} con resultados · `+chrDelta(cur.posts,prev.posts))+K('Alcance',n(cur.reach),chrDelta(cur.reach,prev.reach))+K('Interacción',(cur.er*100).toFixed(1).replace('.',',')+'%',n(cur.inter)+' interacciones · '+chrDelta(cur.inter,prev.inter))+K('Mensajes y clics',n(cur.actions),'+'+n(cur.followers)+' seguidores · '+chrDelta(cur.actions,prev.actions))}</div>
    <div class="grid g2" style="margin-top:14px">
      ${card('Próximos 7 días',best?`Lo que mejor rinde este mes: <b>${esc(CHR_T[best.k]||best.k)}</b> (${(best.er*100).toFixed(1).replace('.',',')}% de interacción, ${best.n} publ.)`:'Aún sin resultados este mes',next.length?`<div class="tbl-wrap"><table class="tbl"><tbody>${next.map(row).join('')}</tbody></table></div>`:empty('Nada agendado','Agenda publicaciones en el planner.'))}
      ${card('Falta cargar resultados',pend.length?`${n(pend.length)} publicaciones ya salieron y no tienen números`:'Todo al día',pend.length?`<div class="tbl-wrap"><table class="tbl"><tbody>${pend.slice(0,12).map(row).join('')}</tbody></table></div>`:empty('Todo al día',''))}
    </div>
    <div class="grid g2">
      ${card('Reglas','Ritmo de subida y horarios en los que no se publica',R.length?`<div class="tbl-wrap"><table class="tbl"><tbody>${R.map(r=>`<tr><td>${r.kind==='block'?'<span class="pill r">no se publica</span>':'<span class="pill g">se publica</span>'}</td><td><b>${esc(r.title||'No se publica')}</b><div class="muted" style="font-size:12px">${(r.days||[]).map(d=>CHR_DOW[d]).join(' ')} · ${r.kind==='block'?esc(chrBlk(r)):esc((CHR_T[r.type]||r.type)+' '+r.time)}</div></td><td>${r.active===false?'<span class="pill">pausada</span>':''}</td></tr>`).join('')}</tbody></table></div>`:empty('Sin reglas',''))}
      ${card('Editores','Pueden crear y editar. Los superadmin siempre pueden; la gente de Ruedda Office solo ve (desde el botón Calendario de la oficina).',ed.error?`<div class="muted">${esc(ed.error.message)}</div>`:`<div class="tbl-wrap"><table class="tbl"><tbody>${E.map(e=>`<tr><td><b>${esc(e.nombre||e.email)}</b><div class="muted" style="font-size:12px">${esc(e.email)}</div></td><td class="r"><button class="btn btn-red" onclick="chrEdDel('${esc(e.user_id)}',this)">Quitar</button></td></tr>`).join('')}
        <tr><td><input class="input" style="height:34px" id="chr-ed" type="email" placeholder="correo de la cuenta de Ruedda"></td><td class="r"><button class="btn btn-primary" onclick="chrEdAdd(this)">Agregar</button></td></tr></tbody></table></div>`)}
    </div>
    <div id="chr-frame-wrap" style="display:none;margin-top:4px">${card('Planner','Editable con tu sesión de Control','<div style="height:min(900px,85vh);border-radius:12px;overflow:hidden"><iframe id="chr-frame" title="Ruedda Chrono" style="width:100%;height:100%;border:0;background:#F5F5F7"></iframe></div>')}</div>`;
};
async function chrSendToken(){ const f=$('#chr-frame'); if(!f||!f.contentWindow) return; const{data:{session}}=await sb.auth.getSession(); if(session) f.contentWindow.postMessage({type:'chrono-auth',token:session.access_token},new URL(CHRONO_URL).origin); }
window.addEventListener('message',e=>{ if(e.origin===new URL(CHRONO_URL).origin&&e.data&&e.data.type==='chrono-ready') chrSendToken(); });
function chrToggleFrame(){ const w=$('#chr-frame-wrap'), f=$('#chr-frame'); if(!w) return; const show=w.style.display==='none'; w.style.display=show?'':'none';
  if(show&&!f.src){ f.src=CHRONO_URL+'?embed=control'; f.addEventListener('load',chrSendToken); clearInterval(window._chrIv); window._chrIv=setInterval(()=>{ if(!document.body.contains(f)) return clearInterval(window._chrIv); chrSendToken(); },240000); }
  if(show) w.scrollIntoView({behavior:'smooth'}); }
async function chrEdAdd(btn){ const e=$('#chr-ed').value.trim(); if(!/^\S+@\S+\.\S+$/.test(e)) return toast('escribe un correo válido',true); btn.disabled=true;
  const{error}=await sb.rpc('chrono_editor_add',{p_email:e}); btn.disabled=false; if(error) return toast('error: '+error.message,true); toast('editor agregado'); RENDER.chrono(++VIEW_TOKEN,[],true); }
async function chrEdDel(uid,btn){ if(!confirm('¿Quitar este editor de Ruedda Chrono?')) return; btn.disabled=true;
  const{error}=await sb.rpc('chrono_editor_remove',{p_user:uid}); if(error){btn.disabled=false;return toast('error: '+error.message,true);} toast('editor quitado'); RENDER.chrono(++VIEW_TOKEN,[],true); }

  V.innerHTML=card('Marcas por aprobar',`${pend.length} pendientes · las proponen las tiendas al publicar`,pend.length?`<div class="tbl-wrap"><table class="tbl"><tbody>${pend.map(b=>`<tr><td style="font-weight:600">${esc(b.name)}</td><td class="muted">${esc([b.kind,b.category].filter(Boolean).join(' · '))}</td><td class="muted">${ago(b.created_at)}</td><td class="r" style="white-space:nowrap"><button class="btn btn-green" style="height:30px" onclick="rAct(SR().rpc('admin_resolve_unlisted_brand',{p_id:'${b.id}',p_approve:true}),'marca aprobada','rmar')">Aprobar</button> <button class="btn btn-red" style="height:30px" onclick="rAct(SR().rpc('admin_resolve_unlisted_brand',{p_id:'${b.id}',p_approve:false}),'marca rechazada','rmar')">Rechazar</button></td></tr>`).join('')}</tbody></table></div>`:empty('Nada pendiente'))
  +`<div class="grid g2">${card('Pedidos de importación','piezas que alguien pidió traer',(Array.isArray(imp.data)?imp.data:[]).length?`<div class="tbl-wrap"><table class="tbl"><tbody>${(Array.isArray(imp.data)?imp.data:[]).slice(0,20).map(r=>`<tr><td><div class="n" style="font-weight:600">${esc(r.part_query||'—')}</div><div class="m muted" style="font-size:11.5px">${esc(r.notes||'')}</div></td><td>${rpill(r.status==='pending'?'pending':r.status==='quoted'?'approved':'closed')}</td><td class="muted">${ago(r.created_at)}</td></tr>`).join('')}</tbody></table></div>`:empty('Sin pedidos de importación'))}
  ${card('Búsquedas sin resultado','30 días',listBars((Array.isArray(miss.data)?miss.data:[]).slice(0,12).map(x=>({q:x.query||x.q||x.term||'',c:x.count||x.n||x.total||0})),'q','c'))}</div>`;
};

/* ════════════ PULIDO DE INTERFAZ (2026-10-05) ════════════
   1. Escrituras idénticas dentro de #view se ignoran: los refrescos de fondo cada 10 s
      ya no reconstruyen tablas, gráficas ni fotos si nada cambió (fin del lag y los saltos).
   2. Cuando el contenido real reemplaza al esqueleto, entra escalonado y los números cuentan.
   3. Cambio de sección: salida rápida, barra fina de progreso y esqueleto solo si tarda.
   4. Fotos con carga diferida y fundido al terminar de cargar. */
(function(){
  const D=Object.getOwnPropertyDescriptor(Element.prototype,'innerHTML');
  const LAST=new WeakMap(), LOADED=new Set();
  let VIEW=null;
  const view=()=>VIEW||(VIEW=document.getElementById('view'));
  window._rdWrote=0;
  Object.defineProperty(Element.prototype,'innerHTML',{configurable:true,enumerable:D.enumerable,get:D.get,set(html){
    const V=view();
    if(!V||!(this===V||V.contains(this))) return D.set.call(this,html);
    html=String(html);
    const prev=D.get.call(this), last=LAST.get(this);
    if(last&&last.a===html&&prev===last.s) return;                 // idéntico: no tocar el DOM
    const fromSkel=prev.indexOf('skel')>=0;
    D.set.call(this,html.replace(/<img(?![^>]*\bloading=)/g,'<img loading="lazy" decoding="async"'));
    LAST.set(this,{a:html,s:D.get.call(this)});
    window._rdWrote++;
    if(LOADED.size) this.querySelectorAll('img').forEach(i=>{ if(LOADED.has(i.getAttribute('src'))) i.classList.add('ld'); }); // ya vista: sin parpadeo
    const isSkel=html.indexOf('skel')>=0;
    if(this===V&&V.classList.contains('vout')){            // primer contenido de la nueva sección
      V.classList.remove('vout','vin'); void V.offsetWidth; V.classList.add('vin');
      if(!isSkel) enter(this);
      return;
    }
    if(window._SOFT){ bumpNums(this); return; }
    if(fromSkel&&!isSkel) enter(this);
  }});

  function enter(el){
    const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches; if(reduce) return;
    let t=[...el.querySelectorAll(':scope > *:not(script), :scope > .grid > *, tbody > tr, .queue > a, .ev, .items > *')];
    t=[...new Set(t)].filter(x=>!x.classList.contains('skel')).slice(0,22);
    t.forEach((x,i)=>{ x.classList.remove('rin-i'); x.style.animationDelay=Math.min(i,14)*26+'ms'; x.classList.add('rin-i');
      x.addEventListener('animationend',()=>{ x.classList.remove('rin-i'); x.style.animationDelay=''; },{once:true}); });
    countUp(el);
  }
  function parseNum(t){ const m=t.match(/\d[\d.,]*/); if(!m) return null; const v=parseInt(m[0].replace(/[.,]/g,''),10); return isFinite(v)?{m:m[0],v}:null; }
  function fmt(v,sample){ const s=String(Math.round(v)); if(!/[.,]/.test(sample)) return s; return s.replace(/\B(?=(\d{3})+(?!\d))/g,sample.match(/[.,]/)[0]); }
  function countUp(el){
    el.querySelectorAll('.kpi .v').forEach(v=>{
      const full=v.textContent, p=parseNum(full); if(!p||p.v<10||v.children.length) return;
      const t0=performance.now(), dur=750;
      const step=now=>{ if(!v.isConnected) return; const k=Math.min(1,(now-t0)/dur), e=1-Math.pow(1-k,3);
        D.set.call(v,full.replace(p.m,fmt(p.v*e,p.m))); if(k<1) requestAnimationFrame(step); else D.set.call(v,full); };
      requestAnimationFrame(step);
    });
  }
  // en refrescos de fondo: si un número cambió, se marca un instante
  const PREVN=new WeakMap();
  function bumpNums(el){
    el.querySelectorAll('.kpi .v').forEach(v=>{ const k=v.closest('.kpi'); const before=PREVN.get(k); const now=v.textContent; PREVN.set(k,now);
      if(before!==undefined&&before!==now){ v.classList.remove('bump'); void v.offsetWidth; v.classList.add('bump'); } });
  }
  // fotos: fundido al cargar
  document.addEventListener('load',e=>{ const t=e.target; if(t&&t.tagName==='IMG'){ t.classList.add('ld'); const s=t.getAttribute('src'); if(s&&LOADED.size<2000) LOADED.add(s); } },true);
  document.addEventListener('error',e=>{ const t=e.target; if(t&&t.tagName==='IMG') t.classList.add('ld'); },true);
  new MutationObserver(()=>{ const V=view(); if(V) V.querySelectorAll('img:not(.ld)').forEach(i=>{ if(i.complete&&i.naturalWidth) i.classList.add('ld'); }); })
    .observe(document.documentElement,{childList:true,subtree:true});

  // barra de progreso
  const bar=document.createElement('div'); bar.id='rdbar'; document.body.appendChild(bar);
  let barT=0;
  window.rdBar=on=>{ clearTimeout(barT);
    if(on){ bar.classList.remove('end','go'); void bar.offsetWidth; bar.classList.add('go'); }
    else { bar.classList.add('end'); barT=setTimeout(()=>bar.classList.remove('go','end'),520); } };

  const SKEL='<div class="card"><div style="padding:18px;display:grid;gap:12px"><div class="skel" style="height:22px;width:40%"></div><div class="skel" style="height:44px"></div><div class="skel" style="height:44px"></div><div class="skel" style="height:44px"></div></div></div>';
  let begunAt=0;
  window.rdBegin=tok=>{
    window._SOFT=false;
    const V=view(); begunAt=window._rdWrote;
    rdBar(true);
    V.classList.remove('vin'); V.classList.add('vout');
    // si la sección no pinta nada en 140 ms, mostramos un esqueleto (nunca pantalla vacía)
    setTimeout(()=>{ if(tok===VIEW_TOKEN&&window._rdWrote===begunAt){ V.innerHTML=SKEL; } },140);
    setTimeout(()=>{ if(tok===VIEW_TOKEN&&V.classList.contains('vout')){ V.classList.remove('vout'); V.classList.add('vin'); } },1800);
  };
  window.rdDone=(tok,p)=>{ p.catch(err=>console.warn('[control]',err)).finally(()=>{ if(tok!==VIEW_TOKEN) return; rdBar(false);
    const V=view(); if(V.classList.contains('vout')){ V.classList.remove('vout'); V.classList.add('vin'); } }); };
  // no reconstruir durante interacción
  window.rdBusy=()=>{ const a=document.activeElement; const V=view();
    if(a&&V&&V.contains(a)&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)) return true;
    if(document.querySelector('.ov')) return true;
    const sel=getSelection&&getSelection(); if(sel&&String(sel).length>0) return true;
    return false; };
})();

</script>
