name: Subastas USA (Copart/IAAI)
on:
  schedule:
    - cron: '15 11 * * *'   # 7:15 a. m. hora de Venezuela, una vez al día (plan gratis de Apibara)
  workflow_dispatch: {}
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/usa-sync.mjs
        env:
          APIBARA_KEY: ${{ secrets.APIBARA_KEY }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
