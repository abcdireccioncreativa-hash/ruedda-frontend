<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Ruedda</title>
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  :root{--splash-bg:#f6f6ef;--white:#15160e;--muted:#7c7e70}
  @media (prefers-color-scheme:dark){
    :root{--splash-bg:#000;--white:#fff;--muted:#8a8a86}
  }
  html,body{height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
  #offline{position:fixed;inset:0;background:var(--splash-bg);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px}
  /* [pedido explícito] mismo glow ambiental que el resto de la app, detrás del icono */
  #offline::before{content:'';position:absolute;top:50%;left:50%;width:280px;height:280px;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,rgba(150,150,150,.10) 0%,transparent 70%);filter:blur(30px);pointer-events:none}
  #offline-mark-wrap{position:relative;width:64px;height:64px;display:flex;align-items:center;justify-content:center;z-index:1}
  #offline-mark{width:64px;height:64px;color:var(--white);opacity:0;animation:bootMarkIn .6s cubic-bezier(.22,.61,.36,1) .1s forwards}
  @keyframes bootMarkIn{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:scale(1)}}
  #offline-title{margin-top:22px;font-size:15px;font-weight:700;color:var(--white);letter-spacing:-.1px;opacity:0;animation:bootTextIn .5s ease .5s forwards;z-index:1}
  #offline-sub{margin-top:6px;font-size:13px;font-weight:400;color:var(--muted);letter-spacing:.1px;opacity:0;animation:bootTextIn .5s ease .65s forwards;z-index:1}
  @keyframes bootTextIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
  #offline-retry{margin-top:22px;background:var(--white);color:var(--splash-bg);border:none;border-radius:100px;padding:11px 22px;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;opacity:0;animation:bootTextIn .5s ease .8s forwards;z-index:1}
  #offline-retry:active{transform:scale(.96)}
</style>
</head>
<body>
<div id="offline">
  <div id="offline-mark-wrap"><div id="offline-mark"></div></div>
  <div id="offline-title">sin conexión</div>
  <div id="offline-sub">Ruedda necesita internet para cargar</div>
  <button id="offline-retry" onclick="location.reload()">reintentar</button>
</div>
<script>
// [mismo isotipo animado que el boot-splash de la app — bandera de olas]
function _rdWaveFlag(el, opts){
  if(!el) return function(){};
  opts = opts || {};
  var svgNS = 'http://www.w3.org/2000/svg';
  var svg = document.createElementNS(svgNS,'svg');
  svg.setAttribute('viewBox','-20 0 400 420');
  svg.setAttribute('width','100%');
  svg.setAttribute('height','100%');
  svg.style.display = 'block';
  var g = document.createElementNS(svgNS,'g');
  g.style.transformOrigin = '180px 200px';
  svg.appendChild(g);
  var LAYOUT = [[110,25,120,90,1],[0,115,110,100,.82],[230,115,120,100,.82],[110,215,120,90,.9],[230,300,120,100,.78]];
  var paths = LAYOUT.map(function(p){
    var path = document.createElementNS(svgNS,'path');
    path.setAttribute('fill','currentColor');
    path.setAttribute('fill-opacity',p[4]);
    g.appendChild(path);
    return path;
  });
  el.appendChild(svg);
  var AMP=10,FREQ=.012,SPEED=Math.PI/4,AMP2=3,FREQ2=.025,SPEED2=Math.PI/2,WI=1.7,SW=2;
  function waveY(x,t){ return WI*(AMP*Math.sin(x*FREQ-SPEED*SW*t)+AMP2*Math.sin(x*FREQ2-SPEED2*SW*t+1.3)); }
  function panelPath(x0,y0,w,h,t){
    var x1=x0+w,y1=y0+h,mx=(x0+x1)/2;
    var wy0=waveY(x0,t),wy1=waveY(x1,t),wym=waveY(mx,t);
    var tl=y0+wy0,tr=y0+wy1,tm=y0+wym;
    var bl=y1+wy0,br=y1+wy1,bm=y1+wym;
    var tc=2*tm-(tl+tr)/2, bc=2*bm-(bl+br)/2;
    return 'M'+x0+' '+tl+' Q'+mx+' '+tc+' '+x1+' '+tr+' L'+x1+' '+br+' Q'+mx+' '+bc+' '+x0+' '+bl+' Z';
  }
  function paint(t){
    for(var i=0;i<LAYOUT.length;i++) paths[i].setAttribute('d', panelPath(LAYOUT[i][0],LAYOUT[i][1],LAYOUT[i][2],LAYOUT[i][3],t));
    g.style.transform = 'rotate('+(Math.sin(t*(Math.PI/4)*SW)*1.4)+'deg)';
  }
  paint(0);
  var reduceMotion=false;
  try{ reduceMotion=window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches; }catch(e){}
  if(reduceMotion) return function(){};
  var start=null, raf=null, lastPaint=0, MIN_FRAME_MS=1000/30;
  function frame(now){
    if(start==null){ start=now; lastPaint=now; }
    if(now-lastPaint>=MIN_FRAME_MS){
      lastPaint=now;
      paint(((now-start)/1000)%8);
    }
    raf=requestAnimationFrame(frame);
  }
  raf=requestAnimationFrame(frame);
  return function stop(){ if(raf) cancelAnimationFrame(raf); };
}
_rdWaveFlag(document.getElementById('offline-mark'),{size:64});

// [auto-retry] si vuelve la conexión sola, recarga sin que el usuario tenga que tocar nada
window.addEventListener('online', function(){ location.reload(); });
</script>
</body>
</html>
